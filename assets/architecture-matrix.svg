<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="320" role="img" aria-label="VANTA Architectural Disciplines &amp; Technical Matrix">
  <defs>
    <style>
      .bg { fill: #080808; }
      .frame { fill: none; stroke: #181818; stroke-width: 1; }
      .rule { stroke: #181818; stroke-width: 1; }
      .idx {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #777777;
        letter-spacing: 1.6px;
        font-variant-numeric: tabular-nums;
      }
      .idx-bright {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #F4F4F4;
        letter-spacing: 1.6px;
        font-variant-numeric: tabular-nums;
      }
      .title {
        font-family: 'Bodoni Moda', 'Cormorant Garamond', Georgia, serif;
        font-size: 22px;
        fill: #F4F4F4;
        font-weight: 400;
      }
      .spec {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #D5D5D5;
        font-variant-numeric: tabular-nums;
      }
      .meta {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #777777;
      }
    </style>
  </defs>

  <rect width="1200" height="320" class="bg" />
  <rect x="0.5" y="0.5" width="1199" height="319" class="frame" />

  <!-- Top Section Bar -->
  <line x1="0" y1="40" x2="1200" y2="40" class="rule" />
  <text x="24" y="25" class="idx-bright">ACT 02 — ARCHITECTURAL SCHEMATIC // FOUR PILLARS OF PRACTICE</text>
  <text x="1176" y="25" text-anchor="end" class="idx">SPECIFICATION LEDGER 01 — 04</text>

  <!-- 4 Equal 300px Columns -->
  <line x1="300" y1="40" x2="300" y2="320" class="rule" />
  <line x1="600" y1="40" x2="600" y2="320" class="rule" />
  <line x1="900" y1="40" x2="900" y2="320" class="rule" />
  <line x1="0" y1="196" x2="1200" y2="196" class="rule" />

  <!-- COLUMN 01: OPTICAL & EDITORIAL SYSTEMS -->
  <text x="24" y="64" class="idx">/01</text>
  <text x="276" y="64" text-anchor="end" class="idx">APERTURE</text>
  <g transform="translate(150, 124)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#181818" stroke-width="1" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#777777" stroke-width="0.75" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="16" fill="none" stroke="#F4F4F4" stroke-width="1.2" />
    <line x1="-52" y1="0" x2="52" y2="0" stroke="#D5D5D5" stroke-width="0.6" stroke-opacity="0.5" />
    <line x1="0" y1="-52" x2="0" y2="52" stroke="#D5D5D5" stroke-width="0.6" stroke-opacity="0.5" />
    <polygon points="0,-26 24,0 0,26 -24,0" fill="none" stroke="#D5D5D5" stroke-width="0.8" />
  </g>
  <text x="24" y="228" class="title">Optical Art Direction</text>
  <text x="24" y="254" class="spec">CSS Clip-Path Shutters · SVG Masks</text>
  <text x="24" y="274" class="spec">Chiaroscuro Plates · Bodoni &amp; Manrope</text>
  <text x="24" y="298" class="meta">— Asymmetric 12-Col Monograph Grids</text>

  <!-- COLUMN 02: PROCEDURAL 3D & SHADERS -->
  <text x="324" y="64" class="idx">/02</text>
  <text x="576" y="64" text-anchor="end" class="idx">SPATIAL</text>
  <g transform="translate(450, 124)">
    <rect x="-44" y="-44" width="88" height="88" fill="none" stroke="#777777" stroke-width="0.75" />
    <line x1="-16" y1="-44" x2="-16" y2="44" stroke="#D5D5D5" stroke-width="0.75" />
    <line x1="18" y1="-44" x2="18" y2="44" stroke="#181818" stroke-width="1" />
    <line x1="-44" y1="-10" x2="44" y2="-10" stroke="#D5D5D5" stroke-width="0.75" />
    <line x1="-44" y1="20" x2="44" y2="20" stroke="#777777" stroke-width="0.6" stroke-dasharray="3 3" />
    <rect x="-16" y="-44" width="60" height="34" fill="#F4F4F4" fill-opacity="0.08" stroke="#F4F4F4" stroke-width="1" />
    <circle cx="-16" cy="-10" r="3" fill="#F4F4F4" />
  </g>
  <text x="324" y="228" class="title">Procedural &amp; GLSL</text>
  <text x="324" y="254" class="spec">Three.js · R3F · Custom Shaders</text>
  <text x="324" y="274" class="spec">Single-Draw InstancedMesh · Zero-Asset</text>
  <text x="324" y="298" class="meta">— Runtime GPU Capability Probing</text>

  <!-- COLUMN 03: KINETIC & ACOUSTIC PHYSICS -->
  <text x="624" y="64" class="idx">/03</text>
  <text x="876" y="64" text-anchor="end" class="idx">TENSION</text>
  <g transform="translate(750, 124)">
    <path d="M -52 0 Q 0 -48 52 0" fill="none" stroke="#777777" stroke-width="0.75" />
    <path d="M -52 0 Q 0 -24 52 0" fill="none" stroke="#D5D5D5" stroke-width="0.9" />
    <line x1="-52" y1="0" x2="52" y2="0" stroke="#F4F4F4" stroke-width="1.2" />
    <path d="M -52 0 Q 0 24 52 0" fill="none" stroke="#D5D5D5" stroke-width="0.9" />
    <path d="M -52 0 Q 0 48 52 0" fill="none" stroke="#777777" stroke-width="0.75" />
    <circle cx="0" cy="-24" r="2.5" fill="#F4F4F4" />
    <circle cx="0" cy="24" r="2.5" fill="#F4F4F4" />
  </g>
  <text x="624" y="228" class="title">Kinetic &amp; Acoustic</text>
  <text x="624" y="254" class="spec">GSAP ScrollTrigger · Lenis Smooth</text>
  <text x="624" y="274" class="spec">Web Audio Synthesizers · Symplectic Math</text>
  <text x="624" y="298" class="meta">— Sub-Pixel Frame Clock Scrubbing</text>

  <!-- COLUMN 04: DETERMINISTIC ARCHITECTURE -->
  <text x="924" y="64" class="idx">/04</text>
  <text x="1176" y="64" text-anchor="end" class="idx">WAVEFORM</text>
  <g transform="translate(1050, 124)">
    <line x1="-52" y1="32" x2="52" y2="32" stroke="#777777" stroke-width="0.75" />
    <line x1="-40" y1="-36" x2="-40" y2="38" stroke="#777777" stroke-width="0.75" />
    <path d="M -40 20 C -18 20, -10 -24, 12 -24 C 32 -24, 42 -24, 52 -24" fill="none" stroke="#F4F4F4" stroke-width="1.3" />
    <circle cx="12" cy="-24" r="3" fill="#F4F4F4" />
    <line x1="12" y1="-24" x2="12" y2="32" stroke="#D5D5D5" stroke-width="0.6" stroke-dasharray="3 3" />
  </g>
  <text x="924" y="228" class="title">Systems Engineering</text>
  <text x="924" y="254" class="spec">React 19 · Strict TypeScript · Vite</text>
  <text x="924" y="274" class="spec">Zero-GC Object Pools · Tauri &amp; Rust</text>
  <text x="924" y="298" class="meta">— Vitest &amp; Playwright E2E Verified</text>
</svg>
