<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FF0055" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF007F" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <style>
      @keyframes pulse {
        0% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(0,255,204,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(0,255,204,0.8)); }
        100% { opacity: 0.85; filter: drop-shadow(0 0 8px rgba(0,255,204,0.4)); }
      }
      @keyframes bar1 { 0%, 100% { height: 12px; } 50% { height: 42px; } }
      @keyframes bar2 { 0%, 100% { height: 28px; } 50% { height: 10px; } }
      @keyframes bar3 { 0%, 100% { height: 35px; } 50% { height: 50px; } }
      @keyframes bar4 { 0%, 100% { height: 8px; } 50% { height: 32px; } }
      .glowing-title { animation: pulse 3s infinite ease-in-out; }
      .eq-bar { fill: #00FFCC; opacity: 0.75; transform-origin: bottom; }
    </style>
  </defs>

  <rect width="850" height="280" rx="16" fill="#080C14" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect x="10" y="10" width="830" height="260" rx="10" fill="url(#coreGlow)" />

  <!-- Terminal Top Bar -->
  <line x1="10" y1="44" x2="840" y2="44" stroke="#1F293D" stroke-width="1" />
  <circle cx="32" cy="27" r="5" fill="#FF5F56" />
  <circle cx="48" cy="27" r="5" fill="#FFBD2E" />
  <circle cx="64" cy="27" r="5" fill="#27C93F" />
  <text x="85" y="31" fill="#64748B" font-family="monospace" font-size="12" letter-spacing="1">dantez@arch-kernel // [GPU-COMPUTE: ACTIVE]</text>
  <text x="730" y="31" fill="#00FF9D" font-family="monospace" font-size="11" letter-spacing="1">● 60 FPS</text>

  <!-- Main Hero Title -->
  <g class="glowing-title">
    <text x="50" y="115" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="6">DANTEZ.EXE</text>
  </g>
  <text x="52" y="148" fill="#94A3B8" font-family="monospace" font-size="14" letter-spacing="3">CREATIVE TECHNOLOGIST &amp; GRAPHICS ENGINEER</text>

  <!-- Tags / Status Chips -->
  <rect x="52" y="172" width="90" height="24" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="68" y="188" fill="#38BDF8" font-family="monospace" font-size="11">WEBGL 2.0</text>

  <rect x="150" y="172" width="86" height="24" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="165" y="188" fill="#A855F7" font-family="monospace" font-size="11">THREE.JS</text>

  <rect x="244" y="172" width="120" height="24" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="258" y="188" fill="#34D399" font-family="monospace" font-size="11">GLSL SHADERS</text>

  <rect x="372" y="172" width="130" height="24" rx="6" fill="#0F172A" stroke="#334155" />
  <text x="384" y="188" fill="#F43F5E" font-family="monospace" font-size="11">PHYSICS ENGINES</text>

  <!-- Audio Waveform Bars -->
  <g transform="translate(700, 210)">
    <rect x="0" y="-15" width="4" height="15" rx="2" class="eq-bar" style="animation: bar1 0.9s infinite ease-in-out;" />
    <rect x="7" y="-25" width="4" height="25" rx="2" class="eq-bar" style="animation: bar3 1.2s infinite ease-in-out;" />
    <rect x="14" y="-10" width="4" height="10" rx="2" class="eq-bar" style="animation: bar2 0.7s infinite ease-in-out;" />
    <rect x="21" y="-35" width="4" height="35" rx="2" class="eq-bar" style="animation: bar1 1.4s infinite ease-in-out;" />
    <rect x="28" y="-20" width="4" height="20" rx="2" class="eq-bar" style="animation: bar3 0.8s infinite ease-in-out;" />
    <rect x="35" y="-30" width="4" height="30" rx="2" class="eq-bar" style="animation: bar2 1.1s infinite ease-in-out;" />
    <rect x="42" y="-12" width="4" height="12" rx="2" class="eq-bar" style="animation: bar4 0.9s infinite ease-in-out;" />
    <rect x="49" y="-28" width="4" height="28" rx="2" class="eq-bar" style="animation: bar1 1.3s infinite ease-in-out;" />
    <rect x="56" y="-18" width="4" height="18" rx="2" class="eq-bar" style="animation: bar3 1.0s infinite ease-in-out;" />
    <rect x="63" y="-8" width="4" height="8" rx="2" class="eq-bar" style="animation: bar2 0.6s infinite ease-in-out;" />
    <text x="-40" y="-5" fill="#475569" font-family="monospace" font-size="10">SYNTH</text>
  </g>

  <!-- Bottom Terminal Status line -->
  <text x="52" y="240" fill="#64748B" font-family="monospace" font-size="12">&gt; root@void:~$ ./deploy_universe --particles 9000 --shaders compiled [OK]</text>
</svg>