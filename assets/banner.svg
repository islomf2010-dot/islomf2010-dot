<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" role="img" aria-label="VANTA — Beyond the Visible: Creative Technologist &amp; Frontend Architect">
  <defs>
    <style>
      .bg { fill: #080808; }
      .frame { fill: none; stroke: #181818; stroke-width: 1; }
      .grid-line { stroke: #181818; stroke-width: 1; }
      .grid-dashed { stroke: #181818; stroke-width: 1; stroke-dasharray: 3 3; }
      .serif-display {
        font-family: 'Bodoni Moda', 'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif;
        fill: #F4F4F4;
        font-weight: 400;
        letter-spacing: -2px;
      }
      .serif-italic {
        font-family: 'Cormorant Garamond', 'Bodoni Moda', Georgia, serif;
        fill: #D5D5D5;
        font-style: italic;
        font-weight: 400;
      }
      .sans-index {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #777777;
        letter-spacing: 1.6px;
        font-variant-numeric: tabular-nums;
      }
      .sans-index-bright {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 11px;
        fill: #F4F4F4;
        letter-spacing: 1.6px;
        font-variant-numeric: tabular-nums;
      }
      .sans-value {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 12px;
        fill: #D5D5D5;
        letter-spacing: 0.6px;
        font-variant-numeric: tabular-nums;
      }
      .sans-prose {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 13px;
        fill: #D5D5D5;
        letter-spacing: 0.2px;
      }
      .slit-beam {
        animation: aperturePulse 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 904px 172px;
      }
      .iris-ring {
        animation: irisBreathe 8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 904px 172px;
      }
      .scan-tick {
        animation: scanShift 6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      @keyframes aperturePulse {
        0%, 100% { opacity: 0.92; transform: scaleX(1); }
        50% { opacity: 0.45; transform: scaleX(0.65); }
      }
      @keyframes irisBreathe {
        0%, 100% { transform: scale(1); stroke-opacity: 0.85; }
        50% { transform: scale(0.92); stroke-opacity: 0.4; }
      }
      @keyframes scanShift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(24px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .slit-beam, .iris-ring, .scan-tick {
          animation: none !important;
        }
      }
    </style>

    <clipPath id="aperturePlateClip">
      <rect x="744" y="64" width="416" height="216" />
    </clipPath>
  </defs>

  <!-- Primary Obsidian Canvas -->
  <rect width="1200" height="360" class="bg" />
  <rect x="0.5" y="0.5" width="1199" height="359" class="frame" />

  <!-- Architectural 4px-Aligned Structural Rules -->
  <line x1="0" y1="48" x2="1200" y2="48" class="grid-line" />
  <line x1="0" y1="296" x2="1200" y2="296" class="grid-line" />
  <line x1="720" y1="48" x2="720" y2="296" class="grid-line" />

  <!-- Top Editorial Masthead Bar (Height: 48px) -->
  <text x="32" y="29" class="sans-index-bright">VANTA // MONOGRAPH IV — 2026</text>
  <line x1="256" y1="16" x2="256" y2="32" class="grid-line" />
  <text x="276" y="29" class="sans-index">ACT 01 — OPTICAL &amp; GENERATIVE ARCHITECTURE</text>
  <text x="1168" y="29" text-anchor="end" class="sans-index">CALIBRATION // f/1.4 · 60 FPS</text>

  <!-- Left Monumental Editorial Composition (Cols 1-7) -->
  <text x="32" y="132" font-size="76" class="serif-display">BEYOND</text>
  <text x="32" y="204" font-size="68" class="serif-italic">THE</text>
  <text x="184" y="204" font-size="76" class="serif-display">VISIBLE</text>

  <!-- Editorial Subtitle & Thesis -->
  <line x1="32" y1="228" x2="48" y2="228" stroke="#F4F4F4" stroke-width="1" />
  <text x="60" y="232" class="sans-index-bright">CREATIVE TECHNOLOGIST, UI/UX ARCHITECT &amp; FRONTEND ENGINEER</text>
  <text x="32" y="260" class="sans-prose">Engineering silence, optical tension, procedural shaders, and deterministic 60 FPS systems for the browser.</text>

  <!-- Right Optical Aperture Plate (Cols 8-12: x=744..1160, y=64..280) -->
  <rect x="744" y="64" width="416" height="216" fill="#0B0B0B" stroke="#181818" stroke-width="1" />

  <g clip-path="url(#aperturePlateClip)">
    <!-- Subtle Brutalist Monolith Columns -->
    <rect x="744" y="64" width="76" height="216" fill="#0E0E0E" stroke="#181818" stroke-width="1" />
    <rect x="820" y="64" width="52" height="216" fill="#121212" stroke="#181818" stroke-width="1" />
    <rect x="936" y="64" width="68" height="216" fill="#121212" stroke="#181818" stroke-width="1" />
    <rect x="1004" y="64" width="156" height="216" fill="#0E0E0E" stroke="#181818" stroke-width="1" />

    <!-- Horizon Floor Reflection Grid -->
    <line x1="744" y1="224" x2="1160" y2="224" class="grid-line" />
    <line x1="744" y1="244" x2="1160" y2="244" class="grid-dashed" />
    <line x1="744" y1="264" x2="1160" y2="264" class="grid-line" />

    <!-- Optical Calibration Crosshairs & Concentric Iris -->
    <circle cx="904" cy="164" r="84" fill="none" stroke="#181818" stroke-width="1" />
    <circle cx="904" cy="164" r="56" fill="none" stroke="#777777" stroke-width="0.75" stroke-dasharray="3 3" class="iris-ring" />
    <circle cx="904" cy="164" r="28" fill="none" stroke="#D5D5D5" stroke-width="1" class="iris-ring" />
    <polygon points="904,116 952,164 904,212 856,164" fill="none" stroke="#777777" stroke-width="0.75" />

    <!-- Standing-Wave Harmonic Curves -->
    <path d="M 756 164 Q 904 108 1052 164" fill="none" stroke="#777777" stroke-width="0.6" stroke-opacity="0.55" />
    <path d="M 756 164 Q 904 220 1052 164" fill="none" stroke="#777777" stroke-width="0.6" stroke-opacity="0.55" />
    <line x1="756" y1="164" x2="1052" y2="164" stroke="#D5D5D5" stroke-width="0.5" stroke-opacity="0.4" />

    <!-- Central Razor-Thin Silver Aperture Slit -->
    <g class="slit-beam">
      <rect x="901" y="64" width="6" height="216" fill="#D5D5D5" fill-opacity="0.14" />
      <rect x="903" y="64" width="2" height="216" fill="#F4F4F4" />
      <!-- Floor Caustic Reflection -->
      <line x1="888" y1="232" x2="920" y2="232" stroke="#F4F4F4" stroke-width="1" stroke-opacity="0.75" />
      <line x1="880" y1="248" x2="928" y2="248" stroke="#D5D5D5" stroke-width="1" stroke-opacity="0.45" />
      <line x1="868" y1="268" x2="940" y2="268" stroke="#777777" stroke-width="1" stroke-opacity="0.3" />
    </g>

    <!-- Optical Scan Reticle Tick -->
    <g class="scan-tick">
      <line x1="892" y1="152" x2="916" y2="152" stroke="#F4F4F4" stroke-width="1" />
    </g>

    <!-- Plate Overlay Caption Box (Top-Right, clear of the slit at x=904) -->
    <rect x="944" y="76" width="204" height="24" fill="#080808" stroke="#181818" stroke-width="1" />
    <text x="1046" y="92" text-anchor="middle" class="sans-index">PLATE 01 // ISO 100</text>
  </g>

  <!-- Bottom 4-Column Specification Ledger (y=296..360) -->
  <line x1="300" y1="296" x2="300" y2="360" class="grid-line" />
  <line x1="600" y1="296" x2="600" y2="360" class="grid-line" />
  <line x1="900" y1="296" x2="900" y2="360" class="grid-line" />

  <text x="32" y="320" class="sans-index">01 // DISCIPLINE</text>
  <text x="32" y="340" class="sans-value">Editorial Direction &amp; Shaders</text>

  <text x="324" y="320" class="sans-index">02 // ARCHITECTURE</text>
  <text x="324" y="340" class="sans-value">Optical 2D · WebGL · GLSL</text>

  <text x="624" y="320" class="sans-index">03 // PERFORMANCE BUDGET</text>
  <text x="624" y="340" class="sans-value">&lt; 4.2ms Frame · Zero Idle CPU</text>

  <text x="924" y="320" class="sans-index">04 // AVAILABILITY</text>
  <text x="924" y="340" class="sans-value">Selective Commissions · UTC+5</text>
</svg>
